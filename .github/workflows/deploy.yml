name: Spiel auf GitHub Pages veröffentlichen

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Quellcode laden
        uses: actions/checkout@v7
      - name: Node.js einrichten
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
      - name: Abhängigkeiten installieren
        run: npm ci
      - name: Spiel bauen
        run: npm run build
      - name: GitHub Pages vorbereiten
        uses: actions/configure-pages@v6
      - name: Spiel hochladen
        uses: actions/upload-pages-artifact@v5
        with:
          path: dist
      - name: Spiel veröffentlichen
        id: deployment
        uses: actions/deploy-pages@v5
